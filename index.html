
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Centenario Marista Champagnat | WebAR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #17385c;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      background: #123b6a;
      color: white;
      padding: 24px 16px;
    }

    h1 { margin: 0 0 8px; }
    p { line-height: 1.5; }

    model-viewer {
      width: 100%;
      height: 58vh;
      min-height: 350px;
      background: #e9edf2;
    }

    .ar-button {
      background: #e7b64c;
      color: #17385c;
      border: 0;
      border-radius: 28px;
      padding: 15px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .instructions {
      padding: 18px;
      max-width: 600px;
      margin: auto;
    }

    footer {
      padding: 18px;
      color: #526579;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>100 años de historia marista</h1>
    <p>Colegio Marista Champagnat</p>
  </header>

  <main>
    <div class="instructions">
      <h2>Una historia que cobra vida</h2>
      <p>
        Explora el personaje en 3D y descubre
        cómo se vería frente a ti.
      </p>
    </div>

    <model-viewer
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      alt="Modelo tridimensional de prueba"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      ar
      ar-modes="scene-viewer quick-look"
      ar-placement="floor"
      ar-scale="fixed">

      <button slot="ar-button" class="ar-button">
        Ver en mi espacio
      </button>

    </model-viewer>

    <div class="instructions">
      <p>
        Pulsa «Ver en mi espacio», apunta
        hacia el suelo y sigue las instrucciones
        de tu dispositivo.
      </p>
      <p id="status"></p>
    </div>
  </main>

  <footer>
    Centenario del Colegio Marista Champagnat
  </footer>

  <script>
    const visor = document.querySelector('model-viewer');
    const status = document.getElementById('status');

    visor.addEventListener('error', () => {
      status.textContent =
        'No se pudo cargar el modelo tridimensional.';
    });

    visor.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'failed') {
        status.textContent =
          'No se pudo iniciar la realidad aumentada.';
      }
    });
  </script>
</body>
</html>
